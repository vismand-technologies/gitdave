name: Release (Tag)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    name: Build and Publish Installers
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      packages: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Prep npm on Windows
        if: matrix.os == 'windows-latest'
        run: |
          npm install -g npm@latest
          npm cache clean --force
          if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }
        shell: pwsh

      - name: Install dependencies (Windows with retry)
        if: matrix.os == 'windows-latest'
        run: |
          $ErrorActionPreference = 'Stop'
          for ($i=1; $i -le 3; $i++) {
            try {
              npm ci
              break
            } catch {
              if ($i -eq 3) { throw }
              Start-Sleep -Seconds 10
            }
          }
        shell: pwsh

      - name: Install dependencies (non-Windows)
        if: matrix.os != 'windows-latest'
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure macOS signing (no-op if env not set)
        if: matrix.os == 'macos-latest'
        run: |
          echo "APPLE_ID=${APPLE_ID:-not-set}" > /dev/null
        shell: bash

      - name: Configure macOS signing mode (unsigned by default; enable if secrets present)
        if: matrix.os == 'macos-latest'
        run: |
          if [[ -n "${{ secrets.APPLE_ID }}" && -n "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" ]]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
            echo "ELECTRON_BUILDER_DISABLE_NOTARIZE=false" >> "$GITHUB_ENV"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ASC_PROVIDER=${{ secrets.ASC_PROVIDER }}" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "ELECTRON_BUILDER_DISABLE_NOTARIZE=true" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Configure Windows signing (no-op if env not set)
        if: matrix.os == 'windows-latest'
        run: |
          echo "CSC_LINK is ${env:CSC_LINK:-not-set}" > $null
        shell: pwsh

      - name: Install WiX Toolset (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          choco install wixtoolset --version=3.14.0 -y
        shell: pwsh

      - name: Package (Build Only)
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            npm run dist:linux -- -p never
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            npm run dist:mac -- -p never
          else
            npm run dist:win:all -- -p never
          fi
        shell: bash

      - name: Upload Release Assets
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create release if it doesn't exist
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          RELEASE_NAME="Release $TAG_NAME"
          
          # Check if release exists
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Creating release $TAG_NAME"
            gh release create "$TAG_NAME" \
              --title "$RELEASE_NAME" \
              --notes "Automated release for $TAG_NAME" \
              --draft=false \
              --prerelease=true
          fi
          
          # Upload Linux artifacts
          echo "Uploading Linux artifacts..."
          find release -name "*.deb" -o -name "*.AppImage" | while read file; do
            echo "Uploading: $file"
            gh release upload "$TAG_NAME" "$file" --clobber
          done
        shell: bash

      - name: Upload Windows Assets
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Uploading Windows artifacts..."
          Get-ChildItem release -Include "*.exe", "*.msi" -Recurse | ForEach-Object {
            Write-Host "Uploading: $($_.FullName)"
            gh release upload "$TAG_NAME" "$($_.FullName)" --clobber
          }
        shell: pwsh

      - name: Upload macOS Assets
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Uploading macOS artifacts..."
          find release -name "*.dmg" | while read file; do
            echo "Uploading: $file"
            gh release upload "$TAG_NAME" "$file" --clobber
          done
        shell: bash
