name: Release (Tag)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    name: Build and Publish Installers
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      packages: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: false
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Prep npm on Windows
        if: matrix.os == 'windows-latest'
        run: |
          npm install -g npm@latest
          npm cache clean --force
          if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }
        shell: pwsh

      - name: Install dependencies (Windows with retry)
        if: matrix.os == 'windows-latest'
        run: |
          $ErrorActionPreference = 'Stop'
          for ($i=1; $i -le 3; $i++) {
            try {
              npm ci
              break
            } catch {
              if ($i -eq 3) { throw }
              Start-Sleep -Seconds 10
            }
          }
        shell: pwsh

      - name: Install dependencies (non-Windows)
        if: matrix.os != 'windows-latest'
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure macOS signing (no-op if env not set)
        if: matrix.os == 'macos-latest'
        run: |
          echo "APPLE_ID=${APPLE_ID:-not-set}" > /dev/null
        shell: bash

      - name: Configure macOS signing mode (unsigned by default; enable if secrets present)
        if: matrix.os == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          ASC_PROVIDER: ${{ secrets.ASC_PROVIDER }}
        run: |
          if [[ -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" ]]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
            echo "ELECTRON_BUILDER_DISABLE_NOTARIZE=false" >> "$GITHUB_ENV"
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            echo "ASC_PROVIDER=$ASC_PROVIDER" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "ELECTRON_BUILDER_DISABLE_NOTARIZE=true" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Configure Windows signing (no-op if env not set)
        if: matrix.os == 'windows-latest'
        run: |
          echo "CSC_LINK is ${env:CSC_LINK:-not-set}" > $null
        shell: pwsh

      - name: Install WiX Toolset (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          choco install wixtoolset --version=3.14.0 -y
        shell: pwsh

      - name: Package (Build Only)
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            npm run dist:linux -- -p never
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            npm run dist:mac -- -p never
          else
            npm run dist:win:all -- -p never
          fi
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          path: |
            app/release/*.deb
            app/release/*.AppImage
            app/release/*.exe
            app/release/*.msi
            app/release/*.dmg
          retention-days: 30

  publish-release:
    name: Publish Release
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create and upload release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          RELEASE_NAME="Release $TAG_NAME"
          
          # Create release if it doesn't exist
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Creating release $TAG_NAME"
            gh release create "$TAG_NAME" \
              --title "$RELEASE_NAME" \
              --notes "Release $TAG_NAME" \
              --draft=false \
              --prerelease=false
          fi
          
          # Upload all artifacts with retry mechanism
          for artifact_dir in artifacts/*/; do
            if [ -d "$artifact_dir" ]; then
              echo "Processing artifacts from: $artifact_dir"
              find "$artifact_dir" -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.exe" -o -name "*.msi" -o -name "*.dmg" \) | while read file; do
                if [ -f "$file" ]; then
                  echo "Uploading: $file"
                  for i in {1..5}; do
                    if gh release upload "$TAG_NAME" "$file" --clobber; then
                      echo "Successfully uploaded: $file"
                      break
                    else
                      echo "Upload failed, retrying ($i/5)..."
                      sleep 10
                      if [ $i -eq 5 ]; then
                        echo "Failed to upload $file after 5 attempts"
                        exit 1
                      fi
                    fi
                  done
                fi
              done
            fi
          done
        shell: bash
