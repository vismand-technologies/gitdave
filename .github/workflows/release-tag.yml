name: Release (Tag)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    name: Build and Publish Installers
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Prep npm on Windows
        if: matrix.os == 'windows-latest'
        run: |
          npm install -g npm@latest
          npm cache clean --force
          if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }
        shell: pwsh

      - name: Install dependencies (Windows with retry)
        if: matrix.os == 'windows-latest'
        run: |
          $ErrorActionPreference = 'Stop'
          for ($i=1; $i -le 3; $i++) {
            try {
              npm ci
              break
            } catch {
              if ($i -eq 3) { throw }
              Start-Sleep -Seconds 10
            }
          }
        shell: pwsh

      - name: Install dependencies (non-Windows)
        if: matrix.os != 'windows-latest'
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure macOS signing (no-op if env not set)
        if: matrix.os == 'macos-latest'
        run: |
          echo "APPLE_ID=${APPLE_ID:-not-set}" > /dev/null
        shell: bash

      - name: Configure macOS signing mode (unsigned by default; enable if secrets present)
        if: matrix.os == 'macos-latest'
        run: |
          if [[ -n "${{ secrets.APPLE_ID }}" && -n "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" ]]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
            echo "ELECTRON_BUILDER_DISABLE_NOTARIZE=false" >> "$GITHUB_ENV"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ASC_PROVIDER=${{ secrets.ASC_PROVIDER }}" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "ELECTRON_BUILDER_DISABLE_NOTARIZE=true" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Configure Windows signing (no-op if env not set)
        if: matrix.os == 'windows-latest'
        run: |
          echo "CSC_LINK is ${env:CSC_LINK:-not-set}" > $null
        shell: pwsh

      - name: Install WiX Toolset (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          choco install wixtoolset --version=3.14.0 -y
        shell: pwsh

      - name: Package and Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            npm run dist:linux -- -p always
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            npm run dist:mac -- -p always
          else
            npm run dist:win:all -- -p always
          fi
        shell: bash
