name: Nightly Pre-release

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch: {}

jobs:
  changes:
    name: Check for commits in last 24h
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commits
        id: check
        run: |
          COUNT=$(git rev-list --count --since="24 hours ago" HEAD || echo 0)
          echo "Commits in last 24h: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    name: Build and Publish Nightly
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      packages: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: false
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Prep npm on Windows
        if: matrix.os == 'windows-latest'
        run: |
          npm install -g npm@latest
          npm cache clean --force
          if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }
        shell: pwsh

      - name: Install dependencies (Windows with retry)
        if: matrix.os == 'windows-latest'
        run: |
          $ErrorActionPreference = 'Stop'
          for ($i=1; $i -le 3; $i++) {
            try {
              npm ci
              break
            } catch {
              if ($i -eq 3) { throw }
              Start-Sleep -Seconds 10
            }
          }
        shell: pwsh

      - name: Install dependencies (non-Windows)
        if: matrix.os != 'windows-latest'
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure macOS signing mode (unsigned by default; enable if secrets present)
        if: matrix.os == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          ASC_PROVIDER: ${{ secrets.ASC_PROVIDER }}
        run: |
          if [[ -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" ]]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
            echo "ELECTRON_BUILDER_DISABLE_NOTARIZE=false" >> "$GITHUB_ENV"
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            echo "ASC_PROVIDER=$ASC_PROVIDER" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "ELECTRON_BUILDER_DISABLE_NOTARIZE=true" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Install WiX Toolset (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          choco install wixtoolset --version=3.14.0 -y
        shell: pwsh

      - name: Compute nightly tag
        id: meta
        run: |
          DATE=$(date -u +"%Y%m%d")
          echo "tag=nightly-$DATE" >> "$GITHUB_OUTPUT"
          echo "release_name=Nightly $DATE" >> "$GITHUB_OUTPUT"

      - name: Package (Build Only)
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            npm run dist:linux -- -p never
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            npm run dist:mac -- -p never
          else
            npm run dist:win:all -- -p never
          fi
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          path: |
            app/release/*.deb
            app/release/*.AppImage
            app/release/*.exe
            app/release/*.msi
            app/release/*.dmg
          retention-days: 7

  publish-nightly:
    name: Publish Nightly Release
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute nightly tag
        id: meta
        run: |
          DATE=$(date -u +"%Y%m%d")
          echo "tag=nightly-$DATE" >> "$GITHUB_OUTPUT"
          echo "release_name=Nightly $DATE" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          NAME="${{ steps.meta.outputs.release_name }}"
          
          # Delete existing nightly release if it exists
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Deleting existing nightly release: $TAG"
            gh release delete "$TAG" --yes || true
            git push origin --delete "$TAG" || true
          fi
          
          # Create new nightly release
          echo "Creating nightly release: $TAG"
          gh release create "$TAG" \
            --prerelease \
            --title "$NAME" \
            --notes "Automated nightly build from commit $(git rev-parse --short HEAD)"
          
          # Upload all artifacts with retry
          for artifact_dir in artifacts/*/; do
            if [ -d "$artifact_dir" ]; then
              echo "Processing artifacts from: $artifact_dir"
              find "$artifact_dir" -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.exe" -o -name "*.msi" -o -name "*.dmg" \) | while read file; do
                if [ -f "$file" ]; then
                  echo "Uploading: $file"
                  for i in {1..3}; do
                    if gh release upload "$TAG" "$file" --clobber; then
                      break
                    else
                      echo "Upload failed, retrying ($i/3)..."
                      sleep 5
                    fi
                  done
                fi
              done
            fi
          done
        shell: bash
